# People First for Linux: builds the patched 0.I executable the way CleverRaven's own release does ("Linux Tiles
# Sounds x64": Ubuntu 22.04, SDL 2.0.20, libbacktrace), drops it into the official 0.I Linux download with both mods
# (tools/make_release_linux.py), checks it with the game's own loader, takes a screenshot of the title screen, and
# uploads the tarball (an artifact, and the release named in release_tag if one is given).
name: Linux release

on:
  workflow_dispatch:
    inputs:
      version:
        description: People First version (names the tarball)
        required: true
        default: "0.9"
      release_tag:
        description: Release to attach the tarball to (empty = artifact only)
        required: false
        default: ""
      werror:
        description: Treat warnings as errors, as upstream does (true/false)
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      CDDA_SHA: 27939e29b8b4ddc081490d9f51de59a459c88df6
      OFFICIAL_URL: https://github.com/CleverRaven/Cataclysm-DDA/releases/download/cdda-0.I-2026-06-06-1535/cdda-linux-with-graphics-and-sounds-x64-2026-06-06-1535.tar.gz
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      SDL_AUDIODRIVER: dummy
    steps:
      - name: Check out People First
        uses: actions/checkout@v4
        with:
          path: pf

      - name: Check out Cataclysm 0.I (27939e2)
        uses: actions/checkout@v4
        with:
          repository: CleverRaven/Cataclysm-DDA
          ref: ${{ env.CDDA_SHA }}
          path: cdda
          fetch-depth: 1

      - name: Install dependencies (as upstream, plus test tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev
          git clone https://github.com/libsdl-org/SDL.git --branch release-2.0.20 --depth 1 sdl-src
          cd sdl-src && mkdir build && cd build && ../configure && make -j"$(nproc)" && sudo make install
          sudo apt-get install -y libncursesw5-dev libsdl2-ttf-dev libsdl2-image-dev libsdl2-mixer-dev libpulse-dev \
            ccache gettext xvfb imagemagick

      - name: Build libbacktrace (as upstream)
        run: |
          git clone https://github.com/ianlancetaylor/libbacktrace.git
          cd libbacktrace && git checkout 14818b7783eeb9a56c3f0fca78cefd3143f8c5f6
          ./configure && make -j"$(nproc)" && sudo make install

      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-linux-${{ hashFiles('pf/engine/apply_patches.py') }}-${{ github.run_id }}
          restore-keys: |
            ccache-linux-${{ hashFiles('pf/engine/apply_patches.py') }}-
            ccache-linux-

      - name: Apply the People First engine patches
        run: python3 pf/engine/apply_patches.py cdda

      - name: Build cataclysm-tiles
        working-directory: cdda
        run: |
          set -o pipefail
          FLAGS="CCACHE=1 TILES=1 SOUND=1 RELEASE=1 LOCALIZE=1 BACKTRACE=1 LIBBACKTRACE=1 PCH=0 TESTS=0"
          if [ "${{ github.event.inputs.werror }}" != "true" ]; then
            # upstream's warning set without -Werror: the build finishes, and the next step lists any warning in our lines
            W="-Wall -Wextra -Wformat-signedness -Wlogical-op -Wmissing-declarations -Wmissing-noreturn -Wpedantic -Wunused-macros"
            make $FLAGS WARNINGS="$W" version prefix
            make -j"$(nproc)" $FLAGS WARNINGS="$W" cataclysm-tiles 2>&1 | tee ../build.log
          else
            make $FLAGS version prefix
            make -j"$(nproc)" $FLAGS cataclysm-tiles 2>&1 | tee ../build.log
          fi
          ls -la cataclysm-tiles
          ccache -s || true

      - name: Save the compiler cache (even if a later step fails)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-linux-${{ hashFiles('pf/engine/apply_patches.py') }}-${{ github.run_id }}

      - name: Warnings in the People First patches
        if: always()
        run: |
          python3 - <<'PY'
          import re, subprocess, os
          diff = subprocess.run(["git", "-C", "cdda", "diff", "-U0"], capture_output=True, text=True).stdout
          ranges, cur = {}, None
          for line in diff.splitlines():
              if line.startswith("+++ b/"):
                  cur = line[6:]
              m = re.match(r"@@ -\S+ \+(\d+)(?:,(\d+))? @@", line)
              if m and cur:
                  a = int(m.group(1)); n = int(m.group(2) or 1)
                  ranges.setdefault(cur, []).append((a, a + max(n, 1) - 1))
          hits = []
          if os.path.exists("build.log"):
              for line in open("build.log", errors="replace"):
                  m = re.match(r"(?:\./)?(src/[^:]+):(\d+):\d+: (warning|error):", line)
                  if m and any(a <= int(m.group(2)) <= b for a, b in ranges.get(m.group(1), [])):
                      hits.append(line.rstrip())
          out = "\n".join(hits) if hits else "none"
          print("Warnings and errors in People First lines:\n" + out)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("### Warnings and errors in People First lines\n```\n" + out + "\n```\n")
          PY

      - name: Stage the release (official 0.I Linux download + our build + mods)
        run: |
          curl -L --fail -o official.tar.gz "$OFFICIAL_URL"
          cd pf && python3 tools/make_release_linux.py stage ../official.tar.gz ../cdda/cataclysm-tiles "${{ github.event.inputs.version }}" ../out

      - name: Check both mods load (the game's own loader, twice)
        run: |
          cd "out/cdda-0.I-people-first-${{ github.event.inputs.version }}-linux-x64"
          mkdir -p config
          ldd ./cataclysm-tiles | grep -i "sdl\|not found" || true
          for n in 1 2; do
            set +e
            xvfb-run -a ./cataclysm-launcher --check-mods people_first_engine > "../check$n.out" 2> "../check$n.err"
            code=$?
            set -e
            echo "run $n: exit $code"
            echo "--- stdout (last 40)"; tail -40 "../check$n.out" || true
            echo "--- stderr (last 40)"; tail -40 "../check$n.err" || true
            errs=$(grep -c " ERROR " config/debug.log 2>/dev/null || true)
            echo "run $n: ${errs:-no log} errors in debug.log"
            cp config/debug.log "../debug$n.log" 2>/dev/null || true
            if [ "$code" != "0" ] || [ "${errs:-0}" != "0" ]; then grep -n " ERROR " -A3 config/debug.log | head -60 || true; exit 1; fi
          done

      - name: Play test (fresh install, Play Now, People menu; screenshots)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          sudo apt-get install -y xdotool openbox x11-utils >/dev/null
          cd "out/cdda-0.I-people-first-${{ github.event.inputs.version }}-linux-x64"
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 & XV=$!
          sleep 2
          openbox & WM=$!       # a window manager, so the game window gets keyboard focus (build 4: keys went nowhere)
          sleep 2
          ./cataclysm-launcher & GAME=$!
          shot() { sleep "$2"; import -window root "../shot-$1.png"; echo "shot $1"; }
          gwin() {
            local p w
            for p in $(pgrep -f "cataclysm-tiles" 2>/dev/null); do
              w=$(timeout 5 xdotool search --pid "$p" 2>/dev/null | tail -1); [ -n "$w" ] && { echo "$w"; return; }
            done
            timeout 5 xdotool search --name "Cataclysm" 2>/dev/null | tail -1
          }
          key() {
            WID=$(gwin)
            if [ -n "$WID" ]; then
              timeout 5 xdotool windowactivate "$WID" 2>/dev/null || timeout 5 xdotool windowfocus "$WID" 2>/dev/null || true
              timeout 5 xdotool key --clearmodifiers "$1" || echo "key $1 failed"
            else
              echo "key $1: no game window"; timeout 5 xdotool key "$1" || true
            fi
          }
          shot 1-language 45
          echo "game window: $(gwin)"
          timeout 10 xwininfo -root -tree 2>/dev/null | grep -i -v "has no name" | head -20 || true
          key Return;  shot 2-title 10                 # English; the New Game menu opens by itself
          key Home; key Down; key Down; key Down; shot 3-play-now-default 2
          key Return;  shot 4-after-play-now 150      # world and character are created
          key Return;  shot 5-after-enter 10
          key comma;   shot 6-people-menu 5
          key p;       shot 7-people-nearby 5
          key Escape;  key Escape; shot 8-closed 3
          kill $GAME || true; sleep 2; pkill -9 -f cataclysm-tiles || true; kill $XV || true
          echo "errors in debug.log: $(grep -c ' ERROR ' config/debug.log 2>/dev/null || echo no-log)"
          grep -n " ERROR " -A3 config/debug.log 2>/dev/null | head -40 || true
          cp config/debug.log ../play-debug.log 2>/dev/null || true
          ls save 2>/dev/null && cat save/*/mods.json 2>/dev/null | head -20 || true

      - name: Pack
        run: cd pf && python3 tools/make_release_linux.py pack "${{ github.event.inputs.version }}" ../out

      - name: Upload the logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: |
            build.log
            out/*.out
            out/*.err
            out/*.log
            out/shot-*.png
          if-no-files-found: ignore

      - name: Upload the tarball and the screenshot
        uses: actions/upload-artifact@v4
        with:
          name: people-first-linux-${{ github.event.inputs.version }}
          path: |
            out/*.tar.gz
            build.log
          compression-level: 0

      - name: Attach to the release
        if: github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.inputs.release_tag }}" "out/cdda-0.I-people-first-${{ github.event.inputs.version }}-linux-x64.tar.gz" --clobber --repo "${{ github.repository }}"
